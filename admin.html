<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理</title>
<style>body{background:#0a0a0f;color:#fff;font-family:system-ui;padding:20px;max-width:600px;margin:0 auto}.g{background:rgba(18,18,24,.58);backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;margin-bottom:16px}h2{margin:0 0 12px;font-size:18px;font-weight:400}input,textarea{width:100%;margin:4px 0 8px;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:14px;box-sizing:border-box}textarea{resize:vertical;min-height:50px}button{padding:6px 14px;border-radius:6px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:14px}button:hover{background:rgba(255,255,255,.2)}pre{background:rgba(0,0,0,.3);padding:10px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}.r{display:flex;gap:8px;flex-wrap:wrap}</style></head>
<body>
<div class="g"><h2>+ 资源上传</h2>
<input id="n" placeholder="名称" value="经典街机人物整合包">
<input id="s" placeholder="大小" value="256MB">
<input id="d" placeholder="下载链接" value="https://mugen.com/dl/classic-arcade-pack">
<textarea id="de" placeholder="介绍">本整合包收录了经典街机格斗游戏的全部人物资源...</textarea>
<input id="c" placeholder="封面图片链接" value="https://example.com/cover.jpg">
<input id="i1" placeholder="图片1链接" value="https://example.com/1.jpg">
<input id="i2" placeholder="图片2链接" value="https://example.com/2.jpg">
<input id="i3" placeholder="图片3链接" value="https://example.com/3.jpg">
<button onclick="add()">添加</button></div>

<div class="g"><h2>+ 更新内容</h2>
<input id="v" placeholder="版本" value="v2.4.0">
<input id="dt" placeholder="日期" value="2025-01-10">
<input id="tx" placeholder="描述" value="新增街机人物整合包、优化搜索响应">
<button onclick="addU()">添加</button></div>

<div class="g"><h2>📄 data.json <button onclick="copy()" style="float:right">复制</button></h2>
<pre id="j">加载中...</pre></div>

<script>
let R=[],U=[];
function render(){document.getElementById('j').textContent=JSON.stringify({resources:R,updates:U},null,2)}
function add(){
 let n=document.getElementById('n').value.trim(),s=document.getElementById('s').value.trim(),d=document.getElementById('d').value.trim(),de=document.getElementById('de').value.trim(),c=document.getElementById('c').value.trim(),i1=document.getElementById('i1').value.trim(),i2=document.getElementById('i2').value.trim(),i3=document.getElementById('i3').value.trim();
 if(!n||!s||!d||!de||!c||!i1||!i2||!i3)return alert('请完整填写');
 let id=R.length?R[R.length-1].id+1:0;
 // 修复字段名：name, size, dl, desc, cover
 R.push({id,name:n,size:s,dl:d,desc:de,cover:c,img1:i1,img2:i2,img3:i3});
 render();
}
function addU(){
 let v=document.getElementById('v').value.trim(),dt=document.getElementById('dt').value.trim(),tx=document.getElementById('tx').value.trim();
 if(!v||!dt||!tx)return alert('请完整填写');
 U.push({v,d:dt,t:tx});
 render();
}
function copy(){
 const text=document.getElementById('j').textContent;
 if(navigator.clipboard){
   navigator.clipboard.writeText(text).then(()=>alert('已复制 JSON')).catch(()=>fallbackCopy(text));
 }else{
   fallbackCopy(text);
 }
}
function fallbackCopy(text){
 const ta=document.createElement('textarea');
 ta.value=text;
 ta.style.position='fixed';ta.style.left='-9999px';
 document.body.appendChild(ta);
 ta.select();
 try{document.execCommand('copy');alert('已复制 JSON')}catch(e){alert('复制失败，请手动复制')}
 document.body.removeChild(ta);
}
// 初始示例 - 字段名修正
R=[{id:0,name:'经典街机人物整合包',size:'256MB',dl:'https://mugen.com/dl/classic-arcade-pack',desc:'本整合包收录了经典街机格斗游戏的全部人物资源...',cover:'https://example.com/cover.jpg',img1:'https://example.com/1.jpg',img2:'https://example.com/2.jpg',img3:'https://example.com/3.jpg'}];
U=[{v:'v2.4.0',d:'2025-01-10',t:'新增街机人物整合包、优化搜索响应'},{v:'v2.3.5',d:'2024-12-28',t:'修复收藏状态同步、新增模式切换'}];
render();
</script>
</body>
</html>
